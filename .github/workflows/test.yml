name: patterns

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # macOS ships BSD grep with no PCRE support, so the matrix is the point:
      # it catches patterns that only work on GNU grep.
      - name: Install ripgrep
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   brew install ripgrep ;;
            Linux)   sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac

      # Windows runs under Git Bash, which ships GNU grep and a POSIX sh.
      # PowerShell has no grep and is not a supported path.
      - name: Run pattern checks
        shell: bash
        run: sh tests/check.sh
